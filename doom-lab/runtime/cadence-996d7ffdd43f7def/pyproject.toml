[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cadence-net"
version = "0.50.0"
description = "Deep Recursive Settlement Networks: processing populations and observers learning and settling together."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Bernhard Mueller" }]
keywords = ["cortical column", "settling", "local learning", "observer", "recursive observation", "supervised learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://floatingpragma.io/cadence/"
Documentation = "https://github.com/muellerberndt/cadence/blob/main/docs/index.md"
Repository = "https://github.com/muellerberndt/cadence"
Issues = "https://github.com/muellerberndt/cadence/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
gpu = ["torch>=2.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF022"]

[tool.coverage.run]
source = ["cadence"]
branch = true

[tool.coverage.report]
show_missing = true
