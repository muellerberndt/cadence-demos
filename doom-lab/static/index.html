<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence Doom Lab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #070505; --line: #1c1512; --bone: #ddd0b8; --dim: #6f6353;
    --blood: #b31b0e; --ember: #ff9b30; --good: #7bb661; --hud: #ff2312;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--void); color: var(--bone);
    font: 13px/1.4 "SF Mono", ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #topbar {
    display: flex; align-items: center; gap: 18px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-family: "Metal Mania", cursive; font-weight: 400;
    font-size: 26px; letter-spacing: 2px; line-height: 1; color: var(--blood);
  }
  .spacer { flex: 1; }
  .bargroup { display: flex; gap: 6px; }
  button, select {
    background: none; color: var(--dim); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 12px; font: inherit;
    letter-spacing: .1em; cursor: pointer;
  }
  button:hover { color: var(--bone); }
  button.active { color: var(--ember); border-color: var(--blood); }
  select { max-width: 210px; color: var(--bone); }
  #substats {
    display: flex; gap: 16px; color: var(--dim); font-size: 11px;
    align-items: center;
  }
  #substats b { color: var(--bone); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim); }
  .dot.ok { background: var(--good); }
  .dot.bad { background: var(--hud); }
  main { flex: 1; display: flex; gap: 12px; padding: 12px 18px; min-height: 0; }
  .panel {
    position: relative; border: 1px solid var(--line); border-radius: 4px;
    background: #000; display: flex; flex-direction: column; min-width: 0;
    overflow: hidden;
  }
  #stagepanel { flex: 1.3; }
  #stage { flex: 1; position: relative; outline: none; display: flex; min-height: 0; }
  #screen {
    width: 100%; height: 100%; object-fit: contain;
    image-rendering: pixelated; display: block; background: #000;
  }
  #stage.focused { box-shadow: inset 0 0 0 1px var(--blood); }
  #stagehint {
    position: absolute; inset: auto 0 10px 0; text-align: center;
    color: var(--dim); font-size: 11px; pointer-events: none;
  }
  #stage.focused #stagehint { display: none; }
  #overlay {
    position: absolute; inset: 10px 12px auto 12px; display: none;
    justify-content: space-between; pointer-events: none;
    font-size: clamp(13px, 1.4vw, 18px); letter-spacing: .12em;
    text-shadow: 0 2px 6px #000;
  }
  body.show #overlay { display: flex; }
  #overlay b { color: var(--ember); }
  #ov-title { color: var(--dim); }
  #ov-title b { color: var(--hud); }
  #brainpanel { flex: 1; }
  #brain3d { flex: 1; min-height: 0; }
  #brain3d canvas { display: block; }
  body.show #brainpanel { position: fixed; right: 16px; bottom: 16px;
    width: 380px; height: 300px; z-index: 6; background: #000d; }
  body.show #topbar { border-color: transparent; }
</style>
</head>
<body class="show">
<header id="topbar">
  <h1>CADENCE&middot;DOOM</h1>
  <div id="substats">
    <span class="dot" id="q-dot" title="settlement"></span>
    <span id="model-cur">&ndash;</span>
    <span>learned <b id="t-admitted">0</b></span>
    <span>ep <b id="g-episode">0</b></span>
    <span id="banner" style="color:var(--ember)"></span>
  </div>
  <div class="spacer"></div>
  <div class="bargroup">
    <button id="m-teach">TEACH</button>
    <button id="m-student">STUDENT</button>
    <button id="m-idle">PAUSE</button>
    <button id="reset">RESET</button>
    <button id="show" class="active">FULLSCREEN</button>
  </div>
  <div class="bargroup">
    <select id="model-sel"></select>
    <button id="export">EXPORT</button>
    <button id="import">IMPORT</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
</header>
<main>
  <div class="panel" id="stagepanel">
    <div id="stage" tabindex="0">
      <img id="screen" src="/video" alt="doom">
      <div id="overlay">
        <span id="ov-title">CADENCE <b>//</b> STUDENT</span>
        <span>HP <b id="ov-health">&ndash;</b> &nbsp; AMMO <b id="ov-ammo">&ndash;</b>
          &nbsp; KILLS <b id="ov-kills">&ndash;</b> &nbsp; EP <b id="ov-episode">&ndash;</b></span>
      </div>
      <div id="stagehint">click, then play &mdash; the student is watching &middot;
        W A S D &middot; &larr;&rarr; turn &middot; &#8679;+&larr;&rarr; strafe &middot;
        ctrl fire &middot; space use</div>
    </div>
  </div>
  <div class="panel" id="brainpanel">
    <div id="brain3d"></div>
  </div>
</main>
<script>
window.BV = {};
let ws = null, down = new Set(), currentModel = null, modStrafe = false;

function setText(id, value) { document.getElementById(id).textContent = value; }
function flash(text) {
  const banner = document.getElementById("banner");
  banner.textContent = text; setTimeout(() => banner.textContent = "", 5000);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function resetVideo() {
  document.getElementById("screen").src = "/video?t=" + Date.now();
}
document.getElementById("screen").onerror = () => setTimeout(resetVideo, 1500);

async function refreshModels() {
  const data = await (await fetch("/models")).json();
  const sel = document.getElementById("model-sel");
  sel.innerHTML = "";
  for (const m of data.models) {
    const option = document.createElement("option");
    option.value = m.id; option.textContent = m.label;
    if (m.id === data.current) option.selected = true;
    sel.appendChild(option);
  }
}
refreshModels();

async function onModelChange(model) {
  currentModel = model.id + ":" + model.fingerprint;
  setText("model-cur", model.id + " " + model.patches + "p");
  const g = await (await fetch("/graph")).json();
  window.BV.graph = g;
  window.BV.graphVersion = (window.BV.graphVersion || 1) + 1;
  refreshModels();
}

function connect() {
  ws = new WebSocket("ws://" + location.host + "/ws");
  ws.onopen = resetVideo;
  ws.onmessage = (event) => {
    const m = JSON.parse(event.data);
    if (m.type === "saved") { flash("saved"); return; }
    if (m.type === "model_ack") { if (!m.ok) flash("load refused"); return; }
    if (m.type !== "state") return;
    setText("g-episode", m.episode);
    if (m.game) {
      setText("ov-health", m.game.health); setText("ov-ammo", m.game.ammo);
      setText("ov-kills", m.game.kills); setText("ov-episode", m.episode);
    }
    const t = m.trainer || {};
    setText("t-admitted", t.admitted ?? 0);
    if (m.model && currentModel !== m.model.id + ":" + m.model.fingerprint
        && !m.model.pending) onModelChange(m.model);
    const s = m.shadow || {};
    if (s.state) {
      Object.assign(window.BV, {state: s.state, errors: s.errors,
        retina_p: s.retina_p, retina_f: s.retina_f, buttons: s.buttons});
    }
    window.BV.admitted = t.admitted ?? 0;
    const dot = document.getElementById("q-dot");
    dot.className = "dot " + (s.qualified === true ? "ok" : s.qualified === false ? "bad" : "");
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();

function setMode(mode) {
  send({type: "mode", mode});
  resetVideo();
  ["teach", "student", "idle"].forEach(m =>
    document.getElementById("m-" + m).classList.toggle("active", m === mode));
  if (mode === "teach") document.getElementById("stage").focus();
}
document.getElementById("m-teach").onclick = () => setMode("teach");
document.getElementById("m-student").onclick = () => setMode("student");
document.getElementById("m-idle").onclick = () => setMode("idle");
document.getElementById("reset").onclick = () => send({type: "reset"});
document.getElementById("model-sel").onchange = (e) =>
  send({type: "model", id: e.target.value});
document.getElementById("show").onclick = () => {
  const on = document.body.classList.toggle("show");
  document.getElementById("show").classList.toggle("active", on);
  if (window.BV.requestResize) window.BV.requestResize();
};
document.getElementById("export").onclick = () => { location.href = "/export"; };
document.getElementById("import").onclick = () =>
  document.getElementById("import-file").click();
document.getElementById("import-file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const name = file.name.replace(/\.json$/i, "");
  try {
    const body = await file.text();
    const response = await fetch("/import?name=" + encodeURIComponent(name),
      {method: "POST", headers: {"Content-Type": "application/json"}, body});
    const result = await response.json();
    flash(result.ok ? "imported: " + result.id : "import failed: " + result.error);
    refreshModels();
  } catch (err) { flash("import failed: " + err); }
  e.target.value = "";
};

const stage = document.getElementById("stage");
stage.addEventListener("focus", () => stage.classList.add("focused"));
stage.addEventListener("blur", () => {
  stage.classList.remove("focused"); down.clear(); modStrafe = false; sendDerived();
});
const KEY_ALIAS = {a: "KeyA", d: "KeyD", s: "KeyS", w: "KeyW", e: "KeyE",
                   j: "KeyJ", " ": "Space", arrowleft: "ArrowLeft",
                   arrowright: "ArrowRight", arrowup: "ArrowUp",
                   arrowdown: "ArrowDown", control: "ControlLeft"};
function keyId(e) {
  if (e.code && e.code !== "Unidentified") return e.code;
  return KEY_ALIAS[(e.key || "").toLowerCase()] || null;
}
function derived() {
  const out = new Set();
  for (const code of down) {
    if (modStrafe && code === "ArrowLeft") out.add("KeyA");
    else if (modStrafe && code === "ArrowRight") out.add("KeyD");
    else out.add(code);
  }
  return [...out];
}
function sendDerived() { send({type: "keys", down: derived()}); }
window.addEventListener("keydown", (e) => {
  if (document.activeElement !== stage) return;
  if (e.code === "Tab") return;
  e.preventDefault();
  modStrafe = e.shiftKey || e.altKey;
  const id = keyId(e);
  if (id && !down.has(id)) down.add(id);
  sendDerived();
});
window.addEventListener("keyup", (e) => {
  modStrafe = e.shiftKey || e.altKey;
  const id = keyId(e);
  if (id) { down.delete(id); e.preventDefault(); }
  if (e.key === "Meta" && down.size) down.clear();
  sendDerived();
});
stage.addEventListener("mousedown", () => { stage.focus(); down.add("Mouse"); sendDerived(); });
window.addEventListener("mouseup", () => { if (down.delete("Mouse")) sendDerived(); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script src="/static/brain3d.js?v=1790639690"></script>
</body>
</html>
