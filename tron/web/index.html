<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tron vs Mako</title>
<meta name="description" content="Ride a light cycle against a Cadence brain that sees the whole arena, and watch every neuron of it settle on its move.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M6 24V10h10v8h10' fill='none' stroke='%232de2ff' stroke-width='3'/%3E%3Cpath d='M26 8h-6' stroke='%23ff4fd8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/play.css">
<link rel="stylesheet" href="cadence-explain.css">
<script src="cadence-explain.js" defer></script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="you">TRON</span><span class="vs">vs</span><span class="them" id="brain-name">MAKO</span></div>
    <div class="score" aria-label="Score" data-explain="Your wins against the brain's wins, in this browser, against this brain and this player." data-explain-title="Score" data-explain-mark="corner"><span class="you" id="score-you">0</span><span class="dash">:</span><span class="them" id="score-them">0</span></div>
    <div class="right">
      <nav class="pick" id="players" aria-label="Who plays" data-explain-mark="corner" data-explain-title="Who plays" data-explain="BRAIN + SEARCH: the brain settles on a move, and a look-ahead over the game's rules checks it four rounds deep and may overrule it. BRAIN ALONE: the brain's settled move and nothing else.">
        <a href="?" data-player="search">BRAIN + SEARCH</a>
        <a href="?player=alone" data-player="alone">BRAIN ALONE</a>
      </nav>
      <nav class="pick" id="pick" aria-label="Which brain" data-explain-mark="corner" data-explain-title="Which brain" data-explain="DEEP: three layers of 256, 128 and 32 neurons. FLAT: one region of 256 neurons. Both see the same arena and answer with the same three motor neurons.">
        <a href="?brain=flat" data-slot="flat">FLAT</a>
        <a href="?brain=deep" data-slot="deep">DEEP</a>
      </nav>
      <span class="statswrap" data-explain="The games you played against this brain and player, and your share of the points (a draw counts half). Kept in this browser." data-explain-title="Your record"><span class="stats" id="stats">0 games</span></span>
      <a class="help" data-help href="help.html" target="_blank" rel="noopener" data-explain="What the page shows, every part explained, and the measured numbers." data-explain-mark="none">HELP</a>
      <button class="icon" id="mute" aria-label="Sound on" data-explain="Sound on or off (key M)." data-explain-mark="none">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg>
      </button>
    </div>
  </header>
  <main class="stage">
    <section class="arena-wrap" id="arena-wrap">
      <canvas id="arena" aria-label="Light-cycle arena"></canvas>
      <div class="overlay" id="overlay"><div class="panel" id="panel">
        <div class="spinner"></div><div class="status" id="status">starting</div>
      </div></div>
    </section>
    <section class="brain-wrap" aria-label="The brain, live">
      <nav class="pick views" id="views" aria-label="Brain view" data-explain-mark="corner" data-explain-title="Two drawings of one brain" data-explain="ANATOMY: the brain laid out as a brain seen from the side, each part where the region whose role it plays would sit. LAYERS: the same neurons layer by layer, grouped by what they track, with what each layer knows."><a data-view="anatomy" href="?view=anatomy">ANATOMY</a><a data-view="layers" href="?view=layers">LAYERS</a></nav>
      <canvas id="brain" aria-label="Every neuron of the brain, layer by layer, and its settle, sweep by sweep"></canvas>
      <div class="zoom" id="zoom" aria-live="polite"></div>
    </section>
  </main>
  <div class="touch">
    <button class="turn" id="left" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="turn" id="right" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <footer class="hint"><span class="desk">space rides · arrows or WASD steer · M mutes · point at a neuron to see what it tracks</span><span class="mob">swipe to steer · tap to ride · tap a neuron to see what it tracks</span></footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
