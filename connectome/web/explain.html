<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How it works · From connectome to Cadence</title>
<meta name="description" content="How measured animal wiring becomes a Cadence patch net: equations, both mathematical preprints, spiking comparison receipts and the scope of the evidence.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./site.css">
<style>
  #explain h3{margin:28px 0 8px;font-family:"Share Tech Mono",monospace;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--bright)}
  #explain .intro{color:var(--ink);font-size:15px}
  #explain ul.adv{margin:8px 0 12px 18px;padding:0}
  #explain ul.adv li{margin:6px 0;color:var(--ink)}
  #explain table{border-collapse:collapse;margin:10px 0;font-size:12.5px}
  #explain th,#explain td{padding:5px 10px;border-bottom:1px solid rgba(0,255,65,.12);text-align:right}
  #explain th:first-child,#explain td:first-child{text-align:left}
  #explain th{color:var(--dim);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
  #explain .note{color:var(--soft);font-size:12.5px;margin:4px 0 0}
  #explain .appendix a{margin-right:14px}
  .glass.wide{max-width:960px;margin:0 auto;overflow:visible}
  /* a reading page: the document scrolls, the panel does not */
  html,body{height:auto;overflow:auto}
  #page{position:static;display:block;min-height:100vh;padding-bottom:calc(var(--strip) + 24px)}
  #main{display:block}
</style>
</head>
<body>
<div id="page">
  <header id="mast"></header>
  <nav id="nav" aria-label="Pages"></nav>
  <main id="main">
    <section class="col glass wide" id="explain">
      <h2 class="page-title" id="page-title"></h2>
      <p class="intro" id="intro"></p>
      <div id="sections"></div>
      <hr>
      <p class="h" id="appendix-title"></p>
      <p class="appendix" id="appendix"></p>
    </section>
  </main>
</div>
<script type="module" src="./explain_page.js"></script>
</body>
</html>
