<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From connectome to Cadence · a larval zebrafish with a compiled brainstem</title>
<meta name="description" content="The larval zebrafish with the compiled brainstem in it: two copies of the compiled half-brainstem, one per side, hold the gaze in a Matrix-styled aquarium while a declared pilot swims the body.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="./site.css">
<style>
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;padding:6px 12px;flex-shrink:0;background:rgba(2,14,7,.96);border-top:1px solid var(--line)}
  #toolbar button{font-size:11px;padding:3px 7px;white-space:nowrap}
  #toolbar .g{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:0 2px 0 8px}
  #toolbar .g:first-child{margin-left:0}
  #saccade-left,#saccade-right{border-color:rgba(255,209,102,.6);color:var(--burst)}
  #saccade-left:hover,#saccade-right:hover{background:rgba(255,209,102,.1)}
  /* a simple toolbar: tap, feed, light, camera, saccades; the stripes and the lamp mover stay reachable by script */
  #stripes,#direction,#speed,#light-move{display:none}
  #hint{position:absolute;right:10px;bottom:8px;color:var(--dim);font-size:10px;text-align:right;pointer-events:none;z-index:3;text-shadow:0 0 4px #000}
  #toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:var(--ink);font-size:12px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:3;text-shadow:0 0 6px #000;white-space:nowrap}
  #toast.show{opacity:1}
  #noscan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  @media(max-width:760px){#hint{display:none}}
</style>
</head>
<body>
<div id="page">
  <header id="mast"></header>
  <nav id="nav" aria-label="Pages"></nav>
  <main id="main" class="two">
    <section class="view" id="tank" aria-label="Aquarium">
      <div class="top"><p class="h" id="tank-title">The fish</p></div>
      <div class="host" id="tank-host">
        <div id="hint">drag to orbit · wheel to zoom · space pauses</div>
        <div id="toast"></div>
      </div>
      <div id="toolbar">
        <span class="g">tank</span>
        <button id="tap-left" type="button" data-tip="Taps the left pane. The pilot's escape: a fast turn away from the tap. The head's yaw drives the compiled vestibular cells, which push the integrator, so the eyes swing against the turn and settle again.">tap left</button>
        <button id="tap-right" type="button" data-tip="Taps the right pane. The pilot's escape: a fast turn away from the tap. The head's yaw drives the compiled vestibular cells, which push the integrator, so the eyes swing against the turn and settle again.">tap right</button>
        <button id="stripes" type="button" title="optomotor stripes on the floor">stripes off</button>
        <button id="direction" type="button" title="the stripes' direction along the tank">direction +x</button>
        <button id="speed" type="button" title="the stripes' speed">5 mm/s</button>
        <button id="prey" type="button" data-tip="Drops a paramecium, the larva's prey, at a random spot. The pilot hunts it: a turn toward it, a strike when it is within reach of the snout, and another one appears.">feed</button>
        <button id="light-move" type="button" title="the lamp to a random place above the tank">move light</button>
        <button id="light-on" type="button" class="on" data-tip="The lamp over the tank, on or off. It lights the tank and the pilot's light senses; no compiled circuit reads it.">light on</button>
        <span class="g">camera</span>
        <button id="follow" type="button" data-tip="The camera follows the fish. Off, it stays where you left it; drag to orbit, wheel to zoom.">follow fish</button>
        <button id="pause" type="button" data-tip="Pauses the fish, its brain and the tank. The space bar does the same.">pause</button>
        <span class="g">saccades</span>
        <button id="saccade-left" type="button" data-tip="A burst to the left half's integrator neurons, the signal the saccade generator outside the reconstruction would send. The eyes jump left, and the compiled integrator holds the new gaze on its own, then lets it drift back over seconds.">saccade left</button>
        <button id="saccade-right" type="button" data-tip="A burst to the right half's integrator neurons, the signal the saccade generator outside the reconstruction would send. The eyes jump right, and the compiled integrator holds the new gaze on its own, then lets it drift back over seconds.">saccade right</button>
      </div>
    </section>
    <section class="view" id="brain" aria-label="Cadence patch net, compiled from the connectome">
      <div class="top"><p class="h">Cadence patch net · the left half, every neuron lit by its activity · gold while it repairs</p><div class="tools"><button id="fit" type="button" data-tip="The brain view back to its resting frame." data-tip-side="below">fit</button><button id="spin" type="button" class="on" data-tip="A slow spin of the brain view until you drag it." data-tip-side="below">spin</button></div></div>
      <div class="host" id="view-host"></div>
    </section>
  </main>
</div>
<div id="loading">loading the Cadence patch net</div>
<script type="module" src="./fish_page.js"></script>
</body>
</html>
